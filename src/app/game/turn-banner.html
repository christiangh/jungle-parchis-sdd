<div
  class="bg-plank relative flex items-center gap-3 rounded-xl border-4 py-1.5 pr-6 pl-2 shadow-lg shadow-black/40 sm:gap-4 sm:pr-8"
  [class]="[fill(), edge()]"
  [attr.data-color]="headline().color"
  data-plank
>
  <span
    class="absolute top-1.5 left-2 size-1.5 rounded-full bg-black/35"
    aria-hidden="true"
    data-nail
  ></span>
  <span
    class="absolute top-1.5 right-2 size-1.5 rounded-full bg-black/35"
    aria-hidden="true"
    data-nail
  ></span>
  <div
    class="size-10 shrink-0 rounded-full shadow-md shadow-black/35 sm:size-13"
    [class]="badge()"
    aria-hidden="true"
    data-badge
  >
    <svg class="size-full" viewBox="-24 -24 48 48">
      <g jp-mascot [color]="headline().color" [radius]="mascotRadius" [animated]="true" />
    </svg>
  </div>
  <div class="text-outline-ink font-display flex-1 text-center text-white" data-text>
    @if (headline().turn; as turn) {
      <p class="sr-only" data-turn>{{ turn }}</p>
    }
    <!-- The invisible copy of the longest action keeps the banner's height, so the board does not
         move when the initial roll ends (SPEC 008 RF-013). -->
    <div class="grid">
      <p
        class="invisible col-start-1 row-start-1 text-xl/tight sm:text-3xl/tight"
        aria-hidden="true"
        data-longest-action
      >
        {{ longestAction }}
      </p>
      <p class="col-start-1 row-start-1 self-center text-xl/tight sm:text-3xl/tight" data-title>
        {{ headline().action }}
      </p>
    </div>
  </div>
</div>
