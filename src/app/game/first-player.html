<div
  class="flex flex-col items-center px-4 [@media(orientation:landscape)_and_(max-height:480px)]:flex-row [@media(orientation:landscape)_and_(max-height:480px)]:gap-6"
>
  <div
    class="bg-plank relative flex flex-col items-center gap-3 rounded-[28px] border-4 px-12 pt-6.5 pb-7.5 shadow-xl shadow-black/50 max-[520px]:px-6.5 max-[520px]:pt-4.5 max-[520px]:pb-5.5 [@media(orientation:landscape)_and_(max-height:480px)]:px-6 [@media(orientation:landscape)_and_(max-height:480px)]:pt-4 [@media(orientation:landscape)_and_(max-height:480px)]:pb-5"
    [class]="[fill(), edge()]"
    data-plank
  >
    <div
      class="size-[160px] shrink-0 rounded-full shadow-md shadow-black/35 max-[520px]:size-[110px] [@media(orientation:landscape)_and_(max-height:480px)]:size-[90px]"
      [class]="animated ? [badge(), 'motion-safe:animate-mascot-bob'] : badge()"
      aria-hidden="true"
      data-badge
    >
      <svg class="size-full" viewBox="-24 -24 48 48">
        <g jp-mascot [color]="player()" [radius]="mascotRadius" [animated]="animated" />
      </svg>
    </div>
    <h2
      class="text-outline-ink font-display text-center text-5xl/tight text-white max-[520px]:text-3xl/tight [@media(orientation:landscape)_and_(max-height:480px)]:text-3xl/tight"
      [id]="titleId"
      data-title
    >
      Empieza el equipo {{ name() }}
    </h2>
  </div>
  <button
    #goButton
    type="button"
    class="bg-champion-button bg-plank font-display text-ink hover:bg-champion-button-hover focus-visible:outline-champion-focus relative mt-5.5 inline-flex min-h-14 cursor-pointer items-center gap-2.5 rounded-2xl border-3 border-champion-button-edge px-7.5 text-2xl shadow-lg shadow-black/45 focus-visible:outline-2 focus-visible:outline-offset-2 active:translate-y-0.5 [@media(orientation:landscape)_and_(max-height:480px)]:mt-0"
    (click)="go.emit()"
    data-go
  >
    ¡Vamos!
  </button>
</div>
