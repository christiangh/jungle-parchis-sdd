<main
  class="bg-jungle bg-jungle-tile flex h-dvh flex-col items-center gap-2 overflow-hidden p-2 sm:gap-4 sm:p-4 [@media(orientation:landscape)_and_(max-height:480px)]:flex-row"
>
  <header class="shrink-0 [@media(orientation:landscape)_and_(max-height:480px)]:max-w-[40%]">
    <jp-turn-banner [headline]="headline()" />
    <!-- The invisible copy of the longest sentence keeps the tab's space, so the board never moves
         (RNF-010); the live region is the fixed slot, so each new sentence is announced. -->
    <div
      class="mx-auto -mt-1 grid w-fit max-w-[calc(100%-2rem)]"
      aria-live="polite"
      data-last-play-slot
    >
      <jp-last-play-tab
        class="invisible col-start-1 row-start-1"
        [play]="longestPlay"
        aria-hidden="true"
        data-longest-play
      />
      @if (lastPlay(); as play) {
        <jp-last-play-tab
          class="col-start-1 row-start-1 justify-self-center"
          [play]="play"
          data-last-play
        />
      }
    </div>
  </header>
  <div
    class="flex min-h-0 w-full min-w-0 flex-1 items-center justify-center self-stretch [container-type:size]"
  >
    <div class="relative aspect-square w-[min(100cqw,100cqh,900px)]" data-board-slot>
      <jp-board
        [state]="store.state()"
        [moves]="store.legalMoves()"
        [selected]="store.selected()"
        (pieceTouch)="store.select($event)"
        (ghostTouch)="store.confirm()"
      />
      <jp-dice
        class="absolute top-1/2 left-1/2 w-[10%] -translate-1/2"
        [face]="store.face()"
        [color]="headline().color"
        [canRoll]="store.canRoll()"
        [rolling]="store.rolling()"
        (roll)="store.roll()"
      />
    </div>
  </div>
</main>
