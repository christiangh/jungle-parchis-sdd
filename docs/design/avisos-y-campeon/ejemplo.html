<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alertas y campeón · Parchís de la jungla</title>
<link rel="stylesheet" href="estilos.css">
<script src="../mascotas/componentes/fichas-animales.js"></script>
<script src="../mascotas/componentes/mascotas-animadas.js"></script>
<script src="componentes/ganador-fx.js"></script>
<script src="componentes/campeon.js"></script>
<style>
  body { margin: 0; min-height: 100vh; background: #a9b18c; font-family: system-ui, sans-serif; color: #2b1d0f; }
  main { max-width: 900px; margin: 0 auto; padding: 40px 24px; display: grid; gap: 28px; }
  h2 { font-family: "Caprasimo", serif; font-weight: 400; margin: 0; }
  .lista { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; padding: 24px; border-radius: 24px; background: #264018; }
  .botones { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: 600 15px system-ui, sans-serif; padding: 10px 18px; border-radius: 999px; border: 0; background: #fff8ea; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h2>Avisos de turno</h2>
  <div class="lista">
    <div class="pj-alerta pj-rojo"><ficha-animal animal="loro" variant="b"></ficha-animal><span class="pj-alerta__texto">Turno de Rojo</span></div>
    <div class="pj-alerta pj-amarillo"><ficha-animal animal="jaguar" variant="e"></ficha-animal><span class="pj-alerta__texto">Turno de Amarillo</span></div>
    <div class="pj-alerta pj-azul"><ficha-animal animal="hipo" variant="g"></ficha-animal><span class="pj-alerta__texto">Turno de Azul</span></div>
    <div class="pj-alerta pj-verde"><ficha-animal animal="rana" variant="a"></ficha-animal><span class="pj-alerta__texto">Turno de Verde</span></div>
  </div>
  <h2>Avisos de jugada</h2>
  <div class="lista">
    <div class="pj-alerta pj-rojo pj-alerta--pequena"><ficha-animal animal="loro" variant="b"></ficha-animal><span class="pj-alerta__texto">¡Te comes una ficha! +20</span></div>
    <div class="pj-alerta pj-amarillo pj-alerta--pequena"><ficha-animal animal="jaguar" variant="e"></ficha-animal><span class="pj-alerta__texto">¡A la meta! +10</span></div>
    <div class="pj-alerta pj-azul pj-alerta--pequena"><ficha-animal animal="hipo" variant="g"></ficha-animal><span class="pj-alerta__texto">¡Sacas un 6! Repites</span></div>
    <div class="pj-alerta pj-verde pj-alerta--pequena"><ficha-animal animal="rana" variant="a"></ficha-animal><span class="pj-alerta__texto">Puente formado</span></div>
  </div>
  <h2>Pantalla de campeón</h2>
  <div class="botones">
    <button onclick="mostrarCampeon('amarillo')">Gana Amarillo</button>
    <button onclick="mostrarCampeon('rojo')">Gana Rojo</button>
    <button onclick="mostrarCampeon('azul')">Gana Azul</button>
    <button onclick="mostrarCampeon('verde')">Gana Verde</button>
  </div>
  <p>Pulsa en la capa oscura para cerrarla.</p>
</main>
<script>document.addEventListener('click', e => { if (e.target.classList && e.target.classList.contains('pj-campeon')) ocultarCampeon(); });</script>
</body>
</html>
