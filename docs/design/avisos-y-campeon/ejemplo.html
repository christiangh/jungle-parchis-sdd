<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos y campeón · Parchís de la jungla</title>
<link rel="stylesheet" href="alertas.css">
<link rel="stylesheet" href="campeon.css">
<script src="../mascotas/componentes/fichas-animales.js"></script>
<script src="../mascotas/componentes/mascotas-animadas.js"></script>
<script src="componentes/ganador-fx.js"></script>
<script src="componentes/campeon.js"></script>
<script src="alertas.js"></script>
<style>
  body { margin: 0; min-height: 100vh; background: #a9b18c; font-family: system-ui, sans-serif; color: #2b1d0f; }
  main { max-width: 900px; margin: 0 auto; padding: 40px 24px; display: grid; gap: 28px; }
  h2 { font-family: "Caprasimo", serif; font-weight: 400; margin: 0; }
  .avisos { display: flex; flex-direction: column; align-items: center; gap: 36px; padding: 32px 16px; }
  .botones { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: 600 15px system-ui, sans-serif; padding: 10px 18px; border-radius: 999px; border: 0; background: #fff8ea; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h2>Avisos de turno y última jugada</h2>
  <div class="avisos" id="avisos">
    <div id="a0"></div>
    <div id="a1"></div>
    <div id="a2"></div>
    <div id="a3"></div>
  </div>
  <h2>Pantalla de campeón</h2>
  <div class="botones">
    <button onclick="ganar('amarillo')">Gana Amarillo</button>
    <button onclick="ganar('rojo')">Gana Rojo</button>
    <button onclick="ganar('azul')">Gana Azul</button>
    <button onclick="ganar('verde')">Gana Verde</button>
  </div>
  <p id="estado">«Nueva partida» cierra la pantalla; en el juego, abre «¿Quién juega?».</p>
</main>
<script>
pintarAviso(document.getElementById('a0'), { turno: 'verde', accion: 'Toca el dado', ultimo: 'rojo', ultimaJugada: 'Saca una ficha de casa' });
pintarAviso(document.getElementById('a1'), { turno: 'azul', accion: 'Elige una ficha', ultimo: 'verde', ultimaJugada: 'Se come una ficha de Azul' });
pintarAviso(document.getElementById('a2'), { turno: 'amarillo', accion: 'Toca el dado', ultimo: 'azul', ultimaJugada: 'Llega a la meta' });
pintarAviso(document.getElementById('a3'), { turno: 'rojo', accion: 'Elige una ficha', ultimo: 'amarillo', ultimaJugada: 'Forma un puente' });
function ganar(eq) { mostrarCampeon(eq, '¡Campeón!', { alNuevaPartida: () => { document.getElementById('estado').textContent = 'Nueva partida: aquí se abre «¿Quién juega?»'; } }); }
</script>
</body>
</html>
