<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parchís de la jungla · Claro de día</title>
<style>html,body{margin:0;height:100%;background:#f5ead8}body{display:grid;place-items:center}parchis-jungla{width:min(96vmin,900px)}</style>
</head>
<body>
<parchis-jungla id="board" variant="claro"></parchis-jungla>
<script>
/* <parchis-jungla variant="claro|suave" numbers="true|false">
   Tablero de parchís español (68 casillas, 12 seguros, pasillos de 7 + meta) en SVG.
   Coordenadas en unidades del viewBox (tablero 0..1000).
   API: el.cellCenter(n) · el.corridorCenter(color, paso 1..7) · el.homeSlots(color) · el.goalCenter(color)
   Evento: 'parchis-cell' {detail:{cell}} al pulsar una casilla del recorrido. */
(function () {
  const H = 40, W = 120, C = 500;
  const ARMS = ['yellow', 'blue', 'red', 'green'];
  const HOME = { red: [0, 0], blue: [680, 0], yellow: [680, 680], green: [0, 680] };
  const EXIT = { 5: 'yellow', 22: 'blue', 39: 'red', 56: 'green' };
  const SAFE = new Set([5, 12, 17, 22, 29, 34, 39, 46, 51, 56, 63, 68]);

  const THEMES = {
    claro: {
      texture: true, safe: 'canopy', rx: 6,
      grass: '#5d8b36', blades: ['#78a845', '#4a7a28', '#86b552', '#557f30'], shade: '#24410f', sun: '#e4f08c',
      wood: '#c99a62', woodLine: '#9e6d3b', woodEdge: '#74491f', moss: '#8a8a48',
      frame: '#6e4524', frameEdge: '#47290f', ink: '#3b2412',
      canopy: ['#1f4a18', '#33702a', '#62a03d'],
      paint: { red: '#c8452d', yellow: '#e3b23a', blue: '#3a7cb0', green: '#2e8b57' },
      leaves: 3, center: 'log'
    },
    suave: {
      texture: false, safe: 'bush', rx: 14,
      grass: '#8fa073', blades: ['#aebf92', '#7d8e62'], shade: null, sun: null,
      wood: '#eee2cc', woodLine: '#d8c6a6', woodEdge: '#b9a684', moss: '#ccdbb2',
      frame: '#a8794a', frameEdge: '#8c5f34', ink: '#474238',
      canopy: ['#3d472b', '#56633f', '#8fa073'],
      paint: { red: '#bd5136', yellow: '#e0ad45', blue: '#4f7f9c', green: '#3f6a3a' },
      leaves: 2, center: 'flat'
    }
  };

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const f = (v) => Math.round(v * 10) / 10;
  function shade(hex, amt) {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    return '#' + c.map((v) => Math.round(v + (t - v) * p).toString(16).padStart(2, '0')).join('');
  }

  // Brazo inferior (amarillo) en coordenadas locales; los otros 3 son rotaciones de -90°.
  function localCells() {
    const out = [];
    for (let n = 1; n <= 8; n++) out.push({ n, x: 560, y: 680 + (8 - n) * H });
    for (let n = 60; n <= 67; n++) out.push({ n, x: 320, y: 680 + (n - 60) * H });
    out.push({ n: 68, x: 440, y: 680 + 7 * H });
    return out;
  }
  const numFor = (n, a) => ((n - 1 + 17 * a) % 68) + 1;
  function rot(x, y, a) {
    const th = -Math.PI / 2 * a, c = Math.round(Math.cos(th)), s = Math.round(Math.sin(th));
    const dx = x - C, dy = y - C;
    return { x: C + dx * c - dy * s, y: C + dx * s + dy * c };
  }

  function leaf(x, y, len, ang, fill, vein) {
    const w = len * 0.24;
    let veins = '';
    for (let i = 1; i <= 4; i++) {
      const p = len * (0.18 + i * 0.16);
      veins += `<path d="M${f(p)} 0 l${f(len * 0.09)} ${f(-w * 0.62)} M${f(p)} 0 l${f(len * 0.09)} ${f(w * 0.62)}" />`;
    }
    return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(ang)})"><path d="M0 0 C${f(len * .22)} ${f(-w * 1.1)} ${f(len * .7)} ${f(-w * 1.05)} ${len} 0 C${f(len * .7)} ${f(w * 1.05)} ${f(len * .22)} ${f(w * 1.1)} 0 0Z" fill="${fill}"/><g stroke="${vein}" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".55"><path d="M3 0 L${f(len * .94)} 0"/>${veins}</g></g>`;
  }

  function build(variant, numbers, uid) {
    const t = THEMES[variant] || THEMES.claro;
    const R = rng(variant.length * 977 + 13);
    const id = (k) => `${k}-${uid}`;
    let defs = '';

    // Hierba
    let blades = '';
    const nb = t.texture ? 90 : 26;
    for (let i = 0; i < nb; i++) {
      const x = R() * 110, y = R() * 110 + 8, h = 6 + R() * (t.texture ? 9 : 6), l = (R() - .5) * 8;
      blades += `<path d="M${f(x)} ${f(y)} q${f(l / 2)} ${f(-h / 2)} ${f(l)} ${f(-h)}" stroke="${t.blades[i % t.blades.length]}" stroke-width="${f(1.3 + R() * (t.texture ? 1.2 : 1.6))}" />`;
    }
    defs += `<pattern id="${id('g')}" patternUnits="userSpaceOnUse" width="110" height="110"><rect width="110" height="110" fill="${t.grass}"/><g fill="none" stroke-linecap="round" opacity="${t.texture ? .9 : .7}">${blades}</g></pattern>`;
    if (t.texture) {
      const cm = (hex, a, b) => {
        const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, bl = parseInt(hex.slice(5, 7), 16) / 255;
        return `0 0 0 0 ${f(r * 100) / 100} 0 0 0 0 ${f(g * 100) / 100} 0 0 0 0 ${f(bl * 100) / 100} 0 0 0 ${a} ${b}`;
      };
      defs += `<filter id="${id('ns')}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="3" seed="4"/><feColorMatrix type="matrix" values="${cm(t.shade, 2.2, -0.9)}"/></filter>`;
      defs += `<filter id="${id('nl')}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="11"/><feColorMatrix type="matrix" values="${cm(t.sun, 2.4, -1.15)}"/></filter>`;
    }

    // Madera y veta
    let grain = '', pgrain = '';
    const nl = t.texture ? 16 : 0;
    for (let i = 0; i < nl; i++) {
      const y = 3 + i * 7.4 + R() * 3, a = 1 + R() * 2.5;
      const d = `M0 ${f(y)} C90 ${f(y + a)} 180 ${f(y - a)} 270 ${f(y + a * .5)} S360 ${f(y)} 360 ${f(y)}`;
      grain += `<path d="${d}" stroke-width="${f(.6 + R() * 1.1)}" opacity="${f(.45 + R() * .45)}"/>`;
      pgrain += `<path d="${d}" stroke="${R() < .7 ? '#000' : '#fff'}" stroke-width="${f(.6 + R() * 1)}" opacity="${f(.1 + R() * .12)}"/>`;
    }
    let knots = '';
    if (t.texture) for (let i = 0; i < 4; i++) {
      const kx = R() * 340 + 10, ky = R() * 110 + 5;
      knots += `<ellipse cx="${f(kx)}" cy="${f(ky)}" rx="7" ry="2.6"/><ellipse cx="${f(kx)}" cy="${f(ky)}" rx="12" ry="4.6" opacity=".5"/>`;
    }
    defs += `<pattern id="${id('w')}" patternUnits="userSpaceOnUse" width="360" height="120"><rect width="360" height="120" fill="${t.wood}"/><g fill="none" stroke="${t.woodLine}">${grain}${knots}</g></pattern>`;
    defs += `<pattern id="${id('pg')}" patternUnits="userSpaceOnUse" width="360" height="120"><g fill="none">${pgrain}</g></pattern>`;

    const woodFill = t.texture ? `url(#${id('w')})` : t.wood;
    const grainOver = (shape) => t.texture ? shape.replace('FILL', `url(#${id('pg')})`) : '';

    // Casillas
    function plank(x, y, w, h, color) {
      const ix = x + 3, iy = y + 2.5, iw = w - 6, ih = h - 5, r = t.rx;
      const fill = color ? t.paint[color] : woodFill;
      let s = `<rect x="${ix + 1}" y="${iy + 3}" width="${iw}" height="${ih}" rx="${r}" fill="#1a240c" opacity="${t.texture ? .38 : .18}"/>`;
      s += `<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="${r}" fill="${fill}" stroke="${color ? 'rgba(0,0,0,.32)' : t.woodEdge}" stroke-width="1.5"/>`;
      if (color) s += grainOver(`<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="${r}" fill="FILL"/>`);
      else if (t.texture) s += `<rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="${r}" fill="${R() < .5 ? '#000' : '#fff'}" opacity="${f(R() * .09)}"/>`;
      else s += `<path d="M${ix + 22} ${iy + ih * .36} h${f(iw * .35)} M${ix + iw * .5} ${iy + ih * .66} h${f(iw * .32)}" stroke="${t.woodLine}" stroke-width="1.6" stroke-linecap="round"/>`;
      s += `<rect x="${ix + 2}" y="${iy + 1.5}" width="${iw - 4}" height="${ih - 3}" rx="${Math.max(2, r - 2)}" fill="none" stroke="#fff" stroke-opacity="${color ? .22 : .18}" stroke-width="1.2"/>`;
      const nc = color ? 'rgba(0,0,0,.4)' : t.woodEdge;
      s += `<circle cx="${ix + 8}" cy="${iy + ih / 2}" r="1.9" fill="${nc}"/><circle cx="${ix + iw - 8}" cy="${iy + ih / 2}" r="1.9" fill="${nc}"/>`;
      return s;
    }
    function num(x, y, w, h, n, light) {
      if (!numbers) return '';
      return `<text x="${x + 24}" y="${y + h / 2 + 4.5}" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-weight="700" font-size="13" fill="${light ? '#fff' : t.ink}" ${light ? `stroke="rgba(0,0,0,.45)" stroke-width="2.4" paint-order="stroke"` : `opacity=".8"`}>${n}</text>`;
    }
    function safeCell(x, y, w, h, color) {
      const cx = x + w / 2, cy = y + h / 2;
      const cp = color ? [shade(t.paint[color], -0.38), t.paint[color], shade(t.paint[color], 0.38)] : t.canopy;
      if (t.safe === 'canopy' || t.safe === 'bush') {
        const flat = t.safe === 'bush';
        const base = y + h - 5;
        let s = `<rect x="${x + 3}" y="${y + 2.5}" width="${w - 6}" height="${h - 5}" rx="${t.rx}" fill="${shade(cp[0], flat ? 0.15 : 0)}" stroke="${flat ? 'none' : 'rgba(0,0,0,.35)'}" stroke-width="1.5"/>`;
        if (!flat) s += `<ellipse cx="${cx}" cy="${base - 1}" rx="${w / 2 - 8}" ry="5" fill="#000" opacity=".25"/>`;
        const tufts = flat ? [-38, -13, 13, 38] : [-44, -27, -9, 9, 27, 44];
        const rows = [[cp[0], 1], [cp[1], .86], [cp[2], .62]];
        rows.forEach(([col, k], ri) => {
          tufts.forEach((tx, ti) => {
            const n = flat ? 3 : 5;
            for (let i = 0; i < n; i++) {
              const bx = cx + tx + (i - (n - 1) / 2) * (flat ? 3.2 : 2.4) + (ri - 1) * 3;
              const len = (h + 2 + R() * 10) * k;
              const lean = (i - (n - 1) / 2) * (flat ? 5 : 4) + (R() - .5) * 6;
              const tipx = bx + lean, tipy = base - len, bw = flat ? 2.6 : 2;
              s += `<path d="M${f(bx - bw)} ${base} Q${f(bx + lean * .2)} ${f(base - len * .55)} ${f(tipx)} ${f(tipy)} Q${f(bx + lean * .35 + bw)} ${f(base - len * .5)} ${f(bx + bw)} ${base}Z" fill="${col}"/>`;
            }
          });
        });
        return s;
      }
      let s = `<rect x="${x + 3}" y="${y + 2.5}" width="${w - 6}" height="${h - 5}" rx="${(h - 5) / 2}" fill="${cp[0]}"/>`;
      s += [[-30, 0, 14], [0, -1, 16], [30, 0, 14]].map(([dx, dy, r]) => `<circle cx="${cx + dx}" cy="${cy + dy}" r="${r}" fill="${cp[1]}"/><circle cx="${cx + dx - 4}" cy="${cy + dy - 4}" r="${r * .45}" fill="${cp[2]}"/>`).join('');
      return s;
    }
    function badge(x, y, w, h) {
      const bx = x + w - 22, by = y + h / 2;
      return `<circle cx="${bx}" cy="${by}" r="10" fill="#fff" opacity=".88"/><g transform="translate(${bx} ${by}) rotate(-35)"><path d="M0 -7 C6 -4 6 4 0 7 C-6 4 -6 -4 0 -7Z" fill="${t.canopy[1]}"/><path d="M0 -5.5 V5.5" stroke="#fff" stroke-width="1" opacity=".7"/></g>`;
    }

    // Composición
    let body = '';
    body += `<rect x="-30" y="-30" width="1060" height="1060" rx="46" fill="${t.frame}" stroke="${t.frameEdge}" stroke-width="3"/>`;
    if (t.texture) body += `<rect x="-30" y="-30" width="1060" height="1060" rx="46" fill="url(#${id('pg')})" opacity=".9"/>`;
    defs += `<clipPath id="${id('clip')}"><rect width="1000" height="1000" rx="22"/></clipPath>`;
    body += `<g clip-path="url(#${id('clip')})"><rect width="1000" height="1000" fill="url(#${id('g')})"/>`;
    if (t.texture) body += `<rect width="1000" height="1000" filter="url(#${id('ns')})" opacity=".55"/><rect width="1000" height="1000" filter="url(#${id('nl')})" opacity=".35"/>`;
    body += `<path d="M312 0H688V312H1000V688H688V1000H312V688H0V312H312Z" fill="#1a1405" opacity="${t.texture ? .16 : .08}"/>`;

    // Casas
    for (const color of ['red', 'blue', 'yellow', 'green']) {
      const [hx, hy] = HOME[color], p = t.paint[color], ins = 30, sz = 320 - 2 * ins, rr = t.texture ? 54 : 80;
      const cid = id('h' + color);
      defs += `<clipPath id="${cid}"><rect x="${hx + ins}" y="${hy + ins}" width="${sz}" height="${sz}" rx="${rr}"/></clipPath>`;
      body += `<rect x="${hx + ins + 3}" y="${hy + ins + 7}" width="${sz}" height="${sz}" rx="${rr}" fill="#14200a" opacity="${t.texture ? .4 : .18}"/>`;
      body += `<rect x="${hx + ins}" y="${hy + ins}" width="${sz}" height="${sz}" rx="${rr}" fill="${p}"/>`;
      body += `<g clip-path="url(#${cid})">`;
      if (t.texture) body += `<rect x="${hx}" y="${hy}" width="320" height="320" fill="url(#${id('pg')})"/>`;
      for (let i = 1; i < 6; i++) body += `<path d="M${hx} ${hy + ins + i * sz / 6} H${hx + 320}" stroke="#000" stroke-opacity="${t.texture ? .22 : .1}" stroke-width="2"/><path d="M${hx} ${hy + ins + i * sz / 6 + 2} H${hx + 320}" stroke="#fff" stroke-opacity=".12" stroke-width="1"/>`;
      body += `</g><rect x="${hx + ins}" y="${hy + ins}" width="${sz}" height="${sz}" rx="${rr}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="4"/><rect x="${hx + ins + 6}" y="${hy + ins + 6}" width="${sz - 12}" height="${sz - 12}" rx="${rr - 6}" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>`;
      for (const [sx, sy] of [[-62, -62], [62, -62], [-62, 62], [62, 62]]) {
        const cx = hx + 160 + sx, cy = hy + 160 + sy;
        body += `<circle cx="${cx}" cy="${cy}" r="37" fill="#fff" opacity=".2"/><circle cx="${cx}" cy="${cy - 1.5}" r="34" fill="#000" opacity="${t.texture ? .28 : .14}"/><circle cx="${cx}" cy="${cy + 2}" r="31" fill="${p}"/><circle cx="${cx}" cy="${cy + 2}" r="31" fill="#000" opacity=".1"/>`;
      }
    }

    // Meta
    let goal = '';
    ARMS.forEach((color, a) => {
      const tri = `<path d="M323 683 L677 683 L500 506Z" FILLATTR stroke-linejoin="round"/>`;
      goal += `<g transform="rotate(${-90 * a} 500 500)">${tri.replace('FILLATTR', `fill="${t.paint[color]}" stroke="rgba(0,0,0,.3)" stroke-width="2"`)}${t.texture ? tri.replace('FILLATTR', `fill="url(#${id('pg')})"`) : ''}</g>`;
    });
    body += goal;

    // Recorrido
    const cells = localCells();
    let track = '', safes = '';
    ARMS.forEach((color, a) => {
      const tr = `rotate(${-90 * a} 500 500)`;
      let g = '';
      for (let k = 0; k < 7; k++) g += `<g data-corridor="${color}" data-step="${7 - k}">${plank(440, 680 + k * H, W, H, color)}</g>`;
      for (const c of cells) {
        const n = numFor(c.n, a);
        if (EXIT[n]) safes += `<g transform="${tr}" data-cell="${n}" data-exit="${EXIT[n]}" style="cursor:pointer">${safeCell(c.x, c.y, W, H, EXIT[n])}${num(c.x, c.y, W, H, n, true)}</g>`;
        else if (SAFE.has(n)) safes += `<g transform="${tr}" data-cell="${n}" style="cursor:pointer">${safeCell(c.x, c.y, W, H)}${num(c.x, c.y, W, H, n, true)}</g>`;
        else g += `<g data-cell="${n}" style="cursor:pointer">${plank(c.x, c.y, W, H)}${num(c.x, c.y, W, H, n, false)}</g>`;
      }
      track += `<g transform="${tr}">${g}</g>`;
    });
    body += track + safes;

    // Centro
    if (t.center === 'log') {
      body += `<circle cx="503" cy="506" r="44" fill="#0f1f06" opacity=".4"/><circle cx="500" cy="500" r="44" fill="#5b3a1d"/><circle cx="500" cy="500" r="37" fill="#dcb27a"/>`;
      for (let i = 1; i <= 5; i++) body += `<circle cx="500" cy="500" r="${37 - i * 6.2}" fill="none" stroke="#b27f46" stroke-width="1.3"/>`;
      body += `<path d="M500 500 L530 478" stroke="#8e5e2e" stroke-width="1.5" stroke-linecap="round"/>`;
    } else {
      body += `<circle cx="500" cy="503" r="42" fill="#000" opacity=".12"/><circle cx="500" cy="500" r="42" fill="${t.wood}" stroke="${t.woodEdge}" stroke-width="2"/><circle cx="500" cy="500" r="26" fill="none" stroke="${t.woodLine}" stroke-width="2"/>`;
    }
    body += `</g>`;

    // Hojas decorativas en las esquinas
    const corners = [[-26, -26, 45], [1026, -26, 135], [1026, 1026, 225], [-26, 1026, 315]];
    let leaves = '';
    corners.forEach(([x, y, base], ci) => {
      for (let i = 0; i < t.leaves; i++) {
        const spread = (i - (t.leaves - 1) / 2) * (t.leaves > 3 ? 17 : 24);
        const len = (t.texture ? 120 : 92) + R() * 40 - Math.abs(spread) * .8;
        const col = t.canopy[(i + ci) % 3 === 2 ? 2 : (i % 2)];
        leaves += leaf(x, y, len, base + spread, col, t.canopy[0]);
      }
    });
    if (t.leaves > 3) {
      [[500, -30, 90], [1030, 500, 180], [500, 1030, 270], [-30, 500, 0]].forEach(([x, y, base]) => {
        [[-150, 0], [150, 0]].forEach(([o]) => {
          const px = base % 180 === 0 ? x : x + o, py = base % 180 === 0 ? y + o : y;
          leaves += leaf(px, py, 70 + R() * 20, base + (R() - .5) * 40, t.canopy[1], t.canopy[0]);
        });
      });
    }
    body += `<g style="filter:drop-shadow(0 4px 4px rgba(10,20,4,.35))">${leaves}</g>`;

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 1080 1080" role="img" aria-label="Tablero de parchís de la jungla" style="display:block;width:100%;height:auto"><defs>${defs}</defs>${body}</svg>`;
  }

  let counter = 0;
  class ParchisJungla extends HTMLElement {
    static get observedAttributes() { return ['variant', 'numbers']; }
    constructor() { super(); this._uid = 'pj' + (++counter); }
    connectedCallback() {
      this.style.display = this.style.display || 'block';
      this.render();
      this.addEventListener('click', (e) => {
        const g = e.target.closest && e.target.closest('[data-cell]');
        if (g) this.dispatchEvent(new CustomEvent('parchis-cell', { bubbles: true, detail: { cell: +g.dataset.cell } }));
      });
    }
    attributeChangedCallback() { if (this.isConnected) this.render(); }
    render() {
      const v = this.getAttribute('variant') || 'claro';
      const n = this.getAttribute('numbers') !== 'false';
      this.innerHTML = build(v, n, this._uid);
    }
    cellCenter(n) {
      for (let a = 0; a < 4; a++) for (const c of localCells()) if (numFor(c.n, a) === n) return rot(c.x + W / 2, c.y + H / 2, a);
      return null;
    }
    corridorCenter(color, step) { const a = ARMS.indexOf(color); return rot(500, 680 + (7 - step) * H + H / 2, a); }
    goalCenter(color) { return rot(500, 620, ARMS.indexOf(color)); }
    homeSlots(color) { const [hx, hy] = HOME[color]; return [[-62, -62], [62, -62], [-62, 62], [62, 62]].map(([x, y]) => ({ x: hx + 160 + x, y: hy + 160 + y })); }
  }
  if (!customElements.get('parchis-jungla')) customElements.define('parchis-jungla', ParchisJungla);
})();

</script>
<script>
  document.getElementById('board').addEventListener('parchis-cell', e => console.log('Casilla', e.detail.cell));
</script>
</body>
</html>
